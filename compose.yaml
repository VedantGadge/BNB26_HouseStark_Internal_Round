services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:7860"

  web:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - api
